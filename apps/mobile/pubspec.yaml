name: mobile
description: Routevia mobile app
publish_to: 'none'
version: 1.2.46+106

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.3.0
  dio: ^5.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  supabase_flutter: ^2.10.3
  geolocator: ^14.0.2
  http: ^1.2.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  flutter_map: ^7.0.2
  flutter_map_marker_cluster: ^1.4.0
  latlong2: ^0.9.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^11.1.0
  app_links: ^6.4.0
  purchases_flutter: ^8.4.0
  image_picker: ^1.2.0
  google_mobile_ads: ^8.0.0
  # AdMob mediation adapter (bidding) — AppLovin (boosts eCPM via auction)
  gma_mediation_applovin: ^2.6.1
  firebase_core: ^4.1.1
  firebase_messaging: ^16.0.1
  firebase_crashlytics: ^5.0.1
  flutter_native_splash: ^2.4.6
  flutter_local_notifications: ^18.0.0
  webview_flutter: ^4.13.1
  connectivity_plus: ^6.1.4
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon_1024.png
  remove_alpha_ios: true
  adaptive_icon_background: "#0B1F3A"
  adaptive_icon_foreground: assets/branding/app_icon_1024.png
  min_sdk_android: 21

flutter_native_splash:
  background_image: assets/branding/splash_bg.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#0B1F3A"
    image: assets/branding/app_icon_1024.png
    icon_background_color: "#0B1F3A"
