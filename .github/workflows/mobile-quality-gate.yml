name: Mobile Quality Gate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main, master, develop ]

jobs:
  flutter-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Pin to the version the app is built/shipped with to avoid
          # version-skew lint failures (e.g. new deprecations on bleeding-edge).
          flutter-version: 3.38.9
          channel: stable
          cache: true

      - name: Flutter pub get
        run: ../../scripts/mobile_flutter.sh pub get

      - name: Flutter analyze
        run: ../../scripts/mobile_flutter.sh analyze

      - name: Flutter test
        run: ../../scripts/mobile_flutter.sh test
